name: registry-auth-check

# Checks that the direct-publish NPM_ACCESS_TOKEN authenticates using whoami
# only. Run before tagging a release. This read-only check does not prove
# package publish permission or the token's 2FA-bypass setting.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-auth-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Who does the token authenticate as
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -eu
          : "${NPM_CONFIG_TOKEN:?NPM_ACCESS_TOKEN is not set}"
          body="$(curl -sfS -H "Authorization: Bearer ${NPM_CONFIG_TOKEN}" \
            https://registry.npmjs.org/-/whoami)"
          who="$(printf '%s' "$body" | sed -n 's/.*"username"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
          if [ -z "$who" ]; then
            echo "authenticated, but no username in the response (${#body} bytes)" >&2
            exit 1
          fi
          echo "token authenticates as: ${who}"
