name: publish

# A publish is irreversible: npm keeps a published version forever. This runs
# only for a pushed version tag, and only after the tag is proven to match the
# manifest, the suite passes, and the registry credential is proven to work.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # bun publish falls back to interactive web auth when the token is missing
    # or invalid: in CI that prints a login URL and hangs. Bound the job.
    timeout-minutes: 10
    steps:
      # actions/checkout v4, pinned to the commit the API returns for
      # refs/tags/v4 (currently v4.4.0). This job holds a registry token, so a
      # moving tag here could be repointed at code that reads it.
      # No invented SHAs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2, pinned to the verified commit below
      # (refs/tags/v2). No invented SHAs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - run: bun test

      - name: Tag must match the manifest version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # Fail here, cheaply, rather than at the irreversible step.
      - name: Registry credential must work
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -eu
          : "${NPM_CONFIG_TOKEN:?NPM_ACCESS_TOKEN is not set}"
          curl -sfS -H "Authorization: Bearer ${NPM_CONFIG_TOKEN}" \
            https://registry.npmjs.org/-/whoami > /dev/null

      # bun publish reads NPM_CONFIG_TOKEN; it does not read ~/.npmrc here.
      # bun has no --provenance, so this produces no npm attestation.
      - name: Publish
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: bun publish --access public
