name: publish

# A publish is irreversible: npm keeps a published version forever. This runs
# only for a pushed version tag, and only after the tag is proven to match the
# manifest, the suite passes, and the registry credential is proven to work.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # bun publish falls back to interactive web auth when the token is missing
    # or invalid: in CI that prints a login URL and hangs. Bound the job.
    timeout-minutes: 10
    steps:
      # actions/checkout v4, pinned to the commit the API returns for
      # refs/tags/v4 (currently v4.4.0). This job holds a registry token, so a
      # moving tag here could be repointed at code that reads it.
      # No invented SHAs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # oven-sh/setup-bun v2, pinned to the verified commit below
      # (refs/tags/v2). No invented SHAs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - run: bun test

      - name: Tag must match the manifest version
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          version="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      # Fetch npm before the credential exists on disk, so the download has
      # nothing to read. The version is pinned and bunx caches the resolution.
      - name: Fetch npm before the credential exists
        run: bunx npm@12.0.2 --version

      # A stage-only token cannot create a package that does not exist. Say so
      # actionably here instead of letting npm return a bare 403 at the end.
      - name: Package must already exist
        run: |
          set -eu
          if ! curl -sfI https://registry.npmjs.org/axstack > /dev/null; then
            echo "axstack does not exist on the registry yet." >&2
            echo "A stage-only token cannot create it. Publish once with a direct-capable" >&2
            echo "credential, then staged releases work from here." >&2
            exit 1
          fi

      # Fail here, cheaply, rather than at the irreversible step. This also
      # writes the credential npm reads: npm uses .npmrc, not NPM_CONFIG_TOKEN.
      - name: Registry credential must work
        env:
          REGISTRY_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
        run: |
          set -eu
          : "${REGISTRY_TOKEN:?NPM_ACCESS_TOKEN is not set}"
          curl -sfS -H "Authorization: Bearer ${REGISTRY_TOKEN}" \
            https://registry.npmjs.org/-/whoami > /dev/null
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "${REGISTRY_TOKEN}" > "${HOME}/.npmrc"

      # The token is stage-only: it defers proof-of-presence, so this stages
      # the version and a maintainer approves it with `npm stage approve`.
      # bun has no staging command, so npm is pinned and run through bunx.
      - name: Stage for approval
        run: bunx --no-install npm@12.0.2 stage publish . --access public
