name: dependabot-merge

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

permissions: {}

jobs:
  merge:
    # Both Bun matrix jobs belong to one ci run; success requires both to pass.
    # PR authors are checked via the API below, not inferred from the run actor.
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify and merge the CI-tested Dependabot PR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          skip() { echo "Skip: $1"; exit 0; }

          pulls="$(gh api "repos/$GH_REPO/commits/$RUN_SHA/pulls" --paginate --slurp)" \
            || skip "PR lookup unavailable"
          number="$(jq -er 'flatten | if length == 1 then .[0].number else empty end' <<< "$pulls")" \
            || skip "Expected exactly one associated PR"
          pr="$(gh api "repos/$GH_REPO/pulls/$number")" \
            || skip "PR details unavailable"
          if ! jq -e --arg sha "$RUN_SHA" '
            .state == "open" and
            .user.login == "dependabot[bot]" and
            (.head.ref | startswith("dependabot/github_actions/")) and
            .head.sha == $sha
          ' <<< "$pr" > /dev/null; then
            skip "PR is not open, authored by Dependabot, on a GitHub Actions branch, and at the CI head SHA"
          fi

          files="$(gh api "repos/$GH_REPO/pulls/$number/files" --paginate --slurp)" \
            || skip "Changed-file lookup unavailable"
          # Check the count too: the API caps file listings at 3,000 files.
          if ! jq -e --argjson expected "$(jq '.changed_files' <<< "$pr")" '
            flatten | length > 0 and length == $expected and
              all(.[]; .filename | startswith(".github/workflows/"))
          ' <<< "$files" > /dev/null; then
            skip "Changed files are incomplete or include paths outside .github/workflows/"
          fi

          gh pr merge "$number" --merge --match-head-commit "$RUN_SHA"
