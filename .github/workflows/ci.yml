name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        bun: ['1.3.14', '1.4.2']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # oven-sh/setup-bun v2, pinned to the verified commit below
      # (refs/tags/v2). No invented SHAs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: ${{ matrix.bun }}
      - run: bun test tests/workflows/
      - run: bun pm pack --dry-run
